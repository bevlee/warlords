apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One entry point for both `kubectl apply -k k8s` and Skaffold. Namespace and
# storage are intentionally declared before the workload for first installs.
resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - certificate.yaml
  - ingress.yaml

# `kubectl apply -k k8s` deploys the same release tag as `skaffold run`.
images:
  - name: docker.io/bevdev1/warlords
    newTag: 0.0.2

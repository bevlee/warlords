apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: warlords
build:
  # Keep release deployments on an explicit, human-readable image version
  # instead of Skaffold's default Git-derived tag.
  tagPolicy:
    envTemplate:
      template: "0.0.2"
  artifacts:
    - image: docker.io/bevdev1/warlords
      docker:
        dockerfile: Dockerfile
deploy:
  kubectl:
    defaultNamespace: warlords
manifests:
  kustomize:
    paths:
      - k8s
